<div class="hbe hbe-container" id="hexo-blog-encrypt"
     data-hbe-format="{{hbeFormat}}"
     data-wpm="{{hbeWrongPassMessage}}"
     data-whm="{{hbeWrongHashMessage}}"
     data-salt="{{hbeSalt}}"
     data-nonce="{{hbeNonce}}"
     data-kdf-iterations="{{hbeKdfIterations}}"
     data-auto-save="{{hbeAutoSave}}"
     data-hbe-levels="{{hbeLevels}}"
     data-min-level="{{hbeMinLevel}}"
     data-hbe-integrity="{{hbeIntegrity}}"
     data-page-corrupt-message="{{hbePageCorruptMessage}}"
     data-level-pass-message="{{hbeLevelPassMessage}}">
  <script id="hbeData" type="hbeData">
    {{hbeEncryptedData}}
  </script>
  {{hbeLevelCiphers}}
  <div class="hbe hbe-content">
    <div class="hbe hbe-message">
      {{hbeMessage}}
    </div>
    <form id="hbeForm" class="hbe hbe-form" hx-boost="false" onsubmit="return false" style="display:flex">
      <div class="hbe hbe-level-select-wrapper" style="display:block">
        <select class="hbe hbe-level-select" id="hbeLevelSelect" aria-label="用户组">
        </select>
      </div>
      <div class="hbe hbe-input hbe-input-default">
        <input class="hbe hbe-input-field hbe-input-field-default" type="password" id="hbePass" aria-label="密码">
        <label class="hbe hbe-input-label hbe-input-label-default" for="hbePass">
          <span class="hbe hbe-input-label-content hbe-input-label-content-default">密码</span>
        </label>
      </div>
      <button class="hbe hbe-button{{hbeButtonClass}}" type="submit">{{hbeButtonText}}</button>
      <div class="hbe hbe-error" role="alert" aria-live="polite"></div>
    </form>
  </div>
</div>
