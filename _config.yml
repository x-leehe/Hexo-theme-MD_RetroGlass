# ============================================================
# MD-RetroGlass Theme Configuration
# ============================================================
# A Hexo theme with Material Design 3 glassmorphism aesthetics,
# styled to match the PageProj (x-leehe.ccwu.cc) visual identity.
# ============================================================

# -------------------------------
# Site Identity
# -------------------------------
avatar: /images/avatar.jpg
favicon: /images/favicon.png

# -------------------------------
# Navigation Menu
# -------------------------------
menu:
  Home: /
  Archives: /archives
  Tags: /tags
  Categories: /categories
  About: /about
  Friends: /friends

# -------------------------------
# Social Links
# -------------------------------
social:
  GitHub: https://github.com/x-leehe
  Telegram: https://t.me/about_leehe
  Email: mailto:x-leehe@outlook.com
  Steam: https://steamcommunity.com/id/x-leehe

# -------------------------------
# Background Images
# -------------------------------
# Array of background image paths (relative to theme source/images/)
# These rotate automatically on the client side.
backgrounds:
  - /images/bg-default.png

# -------------------------------
# Glassmorphism Settings
# -------------------------------
glass:
  blur: 24px
  opacity: 0.7
  border_radius: 28px
  border_opacity: 0.15

# -------------------------------
# Typography
# -------------------------------
font:
  body: "'HarmonyOS Sans', 'Noto Sans SC', sans-serif"
  code: "'JetBrains Mono', 'Fira Code', monospace"
  size: 16px
  line_height: 1.75

# -------------------------------
# Code Highlighting
# -------------------------------
syntax_highlighter: highlight.js

# -------------------------------
# Comment System (choose one: gitalk | utterances)
# -------------------------------
comment_system: utterances

# -------------------------------
# Gitalk Comments
# -------------------------------
gitalk:
  enable: false
  clientID: clientID     # Your GitHub OAuth App clientID
  clientSecret: clientSecret  # Your GitHub OAuth App clientSecret
  repo: about_me        # Repository name for storing comments
  owner: x-leehe
  admin:
    - x-leehe
  id: location.pathname
  distractionFreeMode: false
  createIssueManually: false
  labels:
    - Gitalk

# -------------------------------
# Utterances Comments
# -------------------------------
# See: https://utteranc.es/
utterances:
  enable: true                   # Set to true and fill in below
  repo: 'x-leehe/about_me'        # GitHub repo (format: owner/repo)
  issue_term: pathname            # pathname | url | title | og:title
  label: 'from blog'                       # Optional issue label
  theme: photon-dark   # github-light | github-dark | preferred-color-scheme

# -------------------------------
# APlayer + MetingJS Music Player
# -------------------------------
music:
  enable: true
  server: netease
  type: playlist
  id: '912199427'
  api: 'https://meting.x-leehe.ccwu.cc/api?server=:server&type=:type&id=:id&r=:r'
  list_folded: true
  autoplay: false
  order: list
  preload: auto

# -------------------------------
# SEO & Meta
# -------------------------------
seo:
  robots: noindex, nofollow    # 搜索引擎不允许抓取任何内容
  google_site_verification: ''
  bing_site_verification: ''

# -------------------------------
# Footer
# -------------------------------
footer:
  since: 2025
  copyright: X-LeeHe
  powered_by: true             # Show "Powered by Hexo" credit
  icp: ''                      # ICP备案号，支持HTML（如 <a href="https://beian.miit.gov.cn/">蜀ICP备XX号</a>）
  custom_html: ''              # 页脚自定义HTML（公安备案、版权声明等）

# -------------------------------
# Misc
# -------------------------------
toc:
  enable: true
  list_number: false
  max_depth: 4

post:
  date_format: YYYY-MM-DD
  reading_time: true           # Estimate reading time

scroll_to_top: true
