# ============================================================
# MD-RetroGlass Theme Configuration
# ============================================================
# A Hexo theme with Material Design 3 glassmorphism aesthetics.
# ============================================================

# -------------------------------
# Site Identity
# -------------------------------
avatar: /images/avatar.webp
favicon: /images/favicon.png

# -------------------------------
# Navigation Menu
# -------------------------------
menu:
  首页: /
  归档: /archives
  标签: /tags
  分类: /categories
  关于: /about
  友链: /friends

# -------------------------------
# Social Links
# -------------------------------
social:
  GitHub: https://github.com/yourname
  Telegram: https://t.me/yourname
  Email: mailto:yourname@example.com
  Steam: https://steamcommunity.com/id/yourname

# -------------------------------
# Background Images
# -------------------------------
# Array of background image paths (relative to theme source/images/)
# These rotate automatically on the client side.
backgrounds:
  - /images/bg-default.webp

# -------------------------------
# Glassmorphism Settings
# -------------------------------
glass:
  blur: 24px
  opacity: 0.7
  border_radius: 28px
  border_opacity: 0.15

# -------------------------------
# Typography
# -------------------------------
font:
  body: "'HarmonyOS Sans', 'Noto Sans SC', sans-serif"
  code: "'JetBrains Mono', 'Fira Code', monospace"
  size: 16px
  line_height: 1.75

# -------------------------------
# Code Highlighting (PrismJS with server-side preprocess)
# -------------------------------
syntax_highlighter: prismjs

# -------------------------------
# Comment System (choose one: gitalk | utterances)
# -------------------------------
comment_system: utterances

# -------------------------------
# Gitalk Comments
# -------------------------------
gitalk:
  enable: false
  clientID: your_client_id     # Your GitHub OAuth App clientID
  clientSecret: your_secret    # Your GitHub OAuth App clientSecret
  repo: your_repo              # Repository name for storing comments
  owner: your_github_username
  admin:
    - your_github_username
  id: location.pathname
  distractionFreeMode: false
  createIssueManually: false
  labels:
    - Gitalk

# -------------------------------
# Utterances Comments
# -------------------------------
# See: https://utteranc.es/
utterances:
  enable: false                  # Set to true and fill in below
  repo: 'yourname/yourrepo'      # GitHub repo (format: owner/repo)
  issue_term: pathname            # pathname | url | title | og:title
  label: ''                       # Optional issue label
  theme: photon-dark   # github-light | github-dark | preferred-color-scheme

# -------------------------------
# APlayer + MetingJS Music Player
# -------------------------------
music:
  enable: false
  server: netease
  type: playlist
  id: '114514'
  api: ''               # MetingJS API, leave empty for default
  list_folded: true
  autoplay: false
  order: list
  preload: auto

# -------------------------------
# SEO & Meta
# -------------------------------
seo:
  # ⚠️⚠️⚠️  重要：发布之前必须修改此项！⚠️⚠️⚠️
  # 当前默认禁止所有搜索引擎收录。
  # 如果要让搜索引擎收录你的博客，请改为：
  #   robots: index, follow
  # 并填写下方的 google_site_verification / bing_site_verification。
  robots: noindex, nofollow    # 搜索引擎不允许抓取任何内容
  google_site_verification: ''
  bing_site_verification: ''

# -------------------------------
# Footer
# -------------------------------
footer:
  since: 2025
  copyright: Your Name
  powered_by: true             # Show "Powered by Hexo" credit
  icp: ''                      # ICP备案号，支持HTML（如 <a href="https://beian.miit.gov.cn/">蜀ICP备XX号</a>）
  custom_html: ''              # 页脚自定义HTML（公安备案、版权声明等）

# -------------------------------
# Link Preview Card
# -------------------------------
link_preview:
  enable: true                 # Enable link preview cards
  auto_fetch: true             # Auto-fetch og:description & og:image when show-preview: true
  timeout: 5000                # Request timeout in ms

# -------------------------------
# Misc
# -------------------------------
toc:
  enable: true
  list_number: false
  max_depth: 4

post:
  date_format: YYYY-MM-DD
  reading_time: true           # Estimate reading time

scroll_to_top: true

# -------------------------------
# Encrypt — Multi-Group Access Control
# -------------------------------
# Zero-trust password encryption for posts.
# Level structure is safe to commit to Git. Actual passwords live in
# .encrypt-secret.yml (see template below) — add that file to .gitignore!
#
# ⚠️ SECURITY DISCLAIMER:
# This is browser-side AES-GCM symmetric encryption — NOT military-grade.
# HTTPS is REQUIRED. Passwords in .encrypt-secret.yml must be gitignored.
# For Cloudflare Pages / Vercel remote builds, ensure the repo is Private
# OR inject secrets via platform environment variables at build time.
# The theme is NOT liable for any content leakage.
encrypt:
  enable: true
  secret_file: .encrypt-secret.yml    # Path to external password file
  tips:
    password_incorrect: "密码错误！请你重新输入。"
    page_corrupt: "这不是你的问题——数据可能被破坏了！快告诉主人有坏人在撬锁！"
  groups:
    levels:
      0:
        name: guest
        label: 访客
        # Guest has no password — public access
      1:
        name: friend
        label: 好友
        # Password lives in .encrypt-secret.yml
      2:
        name: vip
        label: VIP
      3:
        name: admin
        label: 管理员

# -------------------------------
# Shortcodes (短代码)
# -------------------------------
# Syntax: {{Function|Description|text}}
#   Description is optional; leave empty to use the defaults below.
shortcodes:
  spoiler_default: 你知道的太多了
  hidden_default: 展开
  blur_default: 你知道的太多了
  tip_default: 提示
  warn_default: 警告
  critical_default: 严重警告
