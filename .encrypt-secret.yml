# ============================================================
# .encrypt-secret.yml — 外置密码文件（模板）
# ============================================================
#
# ⚠️⚠️⚠️  重要安全警告 — PLEASE READ CAREFULLY ⚠️⚠️⚠️
#
# 此文件包含加密密码明文，**绝对不可纳入 Git 仓库**！
# 在你的 Hexo 站点根目录中，务必将此文件加入 .gitignore！
#
#   echo '.encrypt-secret.yml' >> .gitignore
#
# 本主题仓库中包含此文件仅作为模板参考（密码为占位符 CHANGE_ME），
# 以便你了解文件格式。请立即替换为真实密码。
#
# ⚠️ Cloudflare Pages / Vercel 等远程构建特别注意：
#   如果仓库为 Public 且 .encrypt-secret.yml 被 gitignore 排除，
#   远端构建将因缺少密码文件而失败。
#   解决方案：
#     a) 确保 Git 仓库为 Private；或
#     b) 通过平台环境变量/Secrets 功能注入密码，
#        在构建脚本中动态生成此文件。
#
# ⚠️ 免责声明：
#   本加密为前端 AES-GCM 对称加密，并非军事级安全。
#   密码泄露、浏览器恶意扩展、中间人攻击等均可能导致内容被解密。
#   请将加密视为「增加阅读门槛」而非「绝对保密」。
#   如内容因任何原因泄漏，本主题概不负责。
#
# ============================================================

levels:
  1:
    password: "CHANGE_ME"
  2:
    password: "CHANGE_ME"
  3:
    password: "CHANGE_ME"
